<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مِرسال</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231F7A5C' d='m22 2-7 20-4-9-9-4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EFEAE2;--panel:#FFF;--line:#E2E0DA;--ink:#111B21;--mut:#667781;--out:#D9FDD3;--acc:#1F7A5C;--err:#B3452F;--seen:#34B7F1}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#B7BDB9;flex:none}
.dot.on{background:#2EBD71}.dot.wait{background:#E2A03F}.dot.off{background:#D9534F}

/* دخول */
#welcome{height:100dvh;display:grid;place-items:center;background:#F7F5F0;padding:20px}
.wcard{width:min(350px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.wtitle{font-size:30px;font-weight:700;color:var(--acc)}
.wsub{color:var(--mut);font-size:13.5px;margin:6px 0 22px;line-height:1.7}
#wName{width:100%;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;text-align:center}
#wName:focus{border-color:var(--acc)}
.wbtn{width:100%;margin-top:12px;background:var(--acc);color:#fff;border-radius:12px;padding:12px;font-size:15.5px;font-weight:600}
.wbtn:active{transform:translateY(1px)}
.werr{color:var(--err);font-size:12.5px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(4px)}}

/* التطبيق */
#app{height:100dvh;display:flex}
#side{width:340px;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line)}
.sbrand{font-weight:700;font-size:18px;color:var(--acc)}
.net{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.pf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;user-select:none}
.avatar.sm{width:36px;height:36px;font-size:14px}
.pf-main{flex:1;min-width:0}
.pf-namewrap{display:flex;align-items:center;gap:4px;min-width:0}
#pfName{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
#pfNameInput{font:inherit;font-size:13px;border:1.5px solid var(--acc);border-radius:7px;padding:2px 6px;width:118px;outline:none}
.pf-id{font-size:12px;letter-spacing:1px;color:var(--acc);direction:ltr;text-align:right;font-weight:700}
.ibtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:none}
.ibtn:hover{background:#F0F2F5;color:var(--ink)}
.ibtn .ic{width:17px;height:17px}
#newChatBtn{margin:10px 14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--acc);color:#fff;border-radius:11px;font-weight:600;font-size:14.5px}
#newChatBtn:active{transform:translateY(1px)}
#chatList{flex:1;overflow-y:auto}
.list-empty{padding:30px 16px;text-align:center;color:var(--mut);font-size:13px}
.chat-item{display:flex;gap:10px;width:100%;text-align:start;padding:10px 14px;border-bottom:1px solid #F0EDE7;align-items:center}
.chat-item:hover{background:#F7F6F2}
.chat-item.active{background:#F0F2F5}
.ci-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ci-row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-time{font-size:10.5px;color:var(--mut);flex:none}
.ci-row2{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--mut);min-width:0}
.ci-row2 .st{width:15px;height:11px}
.ci-row2 span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp{color:var(--acc);font-weight:600}
.badge{background:#2EBD71;color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 6px;flex:none}
.sb-foot{padding:9px;border-top:1px solid var(--line);text-align:center}
.danger{color:var(--err);font-size:12px}
.danger:hover{text-decoration:underline}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);text-align:center;padding:24px}
.empty h2{font-size:21px;color:var(--ink);font-weight:700}
.empty p{max-width:330px;line-height:1.8;font-size:13.5px}
#conv{flex:1;display:flex;flex-direction:column;min-height:0}
.chead{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:none}
.cmeta{flex:1;min-width:0}
.cname{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cstat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.cstat .typing{color:var(--acc);font-weight:600}
#msgs{flex:1;overflow-y:auto;padding:18px clamp(12px,4%,40px) 12px;display:flex;flex-direction:column}
.msg{display:flex;margin-top:2px;animation:pop .15s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.msg.out{justify-content:flex-end}
.bubble{max-width:min(75%,520px);padding:7px 10px 5px;border-radius:10px;background:var(--panel);box-shadow:0 1px .5px rgba(11,20,26,.13)}
.msg.out .bubble{background:var(--out)}
.bubble.imgb{padding:3px}
.btext{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.bimg{display:block;max-width:min(260px,100%);border-radius:8px;cursor:zoom-in}
.bmeta{display:flex;gap:4px;justify-content:flex-end;align-items:center;font-size:10.5px;color:var(--mut);margin-top:1px;padding:0 2px 1px}
.msg.out .bmeta{color:#5A7266}
.stwrap{display:inline-flex;color:#8696A0}
.msg.out .stwrap[data-st="seen"]{color:var(--seen)}
.st{width:16px;height:12px}
.dsep{align-self:center;margin:12px 0 8px;font-size:11px;color:var(--mut);background:rgba(255,255,255,.9);padding:3px 12px;border-radius:99px;box-shadow:0 1px .5px rgba(11,20,26,.1)}
.no-msgs{margin:auto;color:var(--mut);font-size:13px;text-align:center;max-width:300px;line-height:1.8;border:1.5px dashed #C9C5BC;padding:14px 20px;border-radius:12px;background:rgba(255,255,255,.6)}
.tdots{display:flex;gap:4px;padding:12px 14px;align-items:center}
.tdots span{width:6px;height:6px;border-radius:50%;background:#8696A0;animation:tb 1s infinite}
.tdots span:nth-child(2){animation-delay:.15s}.tdots span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:9px 12px;background:var(--panel);border-top:1px solid var(--line)}
#ta{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 15px;font-size:15px;max-height:120px;outline:none;line-height:1.5;background:var(--panel)}
#ta:focus{border-color:var(--acc)}
.roundbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
#fileBtn{color:var(--mut)}
#fileBtn:hover{background:#F0F2F5}
#sendBtn{background:var(--acc);color:#fff}
#sendBtn:active{transform:translateY(1px)}

.overlay{position:fixed;inset:0;background:rgba(11,20,26,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:min(400px,100%);position:relative;animation:mIn .2s ease}
@keyframes mIn{from{transform:translateY(12px);opacity:0}}
.modal h3{font-size:19px;margin-bottom:4px}
.modal>p{color:var(--mut);font-size:13px;line-height:1.7;margin-bottom:14px}
.mx{position:absolute;top:10px;inset-inline-start:10px}
#mcInput{width:100%;font-size:18px;font-weight:700;letter-spacing:3px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;text-align:center;direction:ltr}
#mcInput:focus{border-color:var(--acc)}
.mbtn{width:100%;margin-top:12px;background:var(--acc);color:#fff;border-radius:11px;padding:11px;font-weight:600;font-size:15px}
.mbtn:disabled{opacity:.6;cursor:default}
.merr{color:var(--err);font-size:12.5px;margin-top:9px;line-height:1.6}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:grid;place-items:center;cursor:zoom-out}
#viewer img{max-width:94vw;max-height:94vh;border-radius:6px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#233138;color:#E9EDEF;padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px);transition:.25s;max-width:100%;text-align:center}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--err)}

@media(max-width:820px){
 #side{width:100%;border-inline-end:none}
 #conv{position:fixed;inset:0;z-index:20;display:none}
 body.in-chat #conv{display:flex}
 body.in-chat #side{display:none}
 .back{display:grid}
 .bubble{max-width:84%}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</defs></svg>

<section id="welcome">
  <form class="wcard" id="wForm" novalidate>
    <div class="wtitle">مِرسال</div>
    <p class="wsub">راسل أي شخص مباشرةً بمعرّفه.<br>أدخل اسمك للبدء.</p>
    <input id="wName" maxlength="24" autocomplete="off" placeholder="اسمك">
    <button class="wbtn" type="submit" id="wGo">دخول</button>
    <p class="werr" id="wErr" hidden>اكتب اسماً من حرفين على الأقل.</p>
  </form>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="shead">
      <span class="sbrand">مِرسال</span>
      <span class="net"><span class="dot wait" id="netDot"></span><span id="netText">…</span></span>
    </div>
    <div class="pf">
      <span class="avatar" id="pfAvatar">؟</span>
      <div class="pf-main">
        <div class="pf-namewrap">
          <span id="pfName"></span><input id="pfNameInput" hidden maxlength="24">
          <button class="ibtn" id="editNameBtn" title="تعديل الاسم"><svg class="ic"><use href="#i-pencil"/></svg></button>
        </div>
        <div class="pf-id" id="pfId" dir="ltr"></div>
      </div>
      <button class="ibtn" id="copyIdBtn" title="نسخ المعرّف"><svg class="ic"><use href="#i-copy"/></svg></button>
    </div>
    <button id="newChatBtn"><svg class="ic"><use href="#i-plus"/></svg>محادثة جديدة</button>
    <div id="chatList"></div>
    <div class="sb-foot"><button class="danger" id="logoutBtn">تسجيل الخروج ومسح البيانات</button></div>
  </aside>

  <main id="main">
    <div id="empty" class="empty">
      <h2>ابدأ مراسلة</h2>
      <p>اختر محادثة من القائمة، أو أدخل معرّف الطرف الآخر لبدء محادثة جديدة.</p>
      <button id="emptyNewBtn" class="wbtn" style="width:auto;padding:10px 24px;margin-top:0">محادثة جديدة</button>
    </div>
    <section id="conv" hidden>
      <header class="chead">
        <button class="ibtn back" id="backBtn"><svg class="ic"><use href="#i-back"/></svg></button>
        <span class="avatar sm" id="cAvatar">؟</span>
        <div class="cmeta">
          <div class="cname" id="cName"></div>
          <div class="cstat"><span class="dot" id="cDot"></span><span id="cStatText"></span></div>
        </div>
        <button class="ibtn" id="clearBtn" title="مسح المحادثة"><svg class="ic"><use href="#i-trash"/></svg></button>
      </header>
      <div id="msgs"></div>
      <div class="composer">
        <button class="roundbtn" id="fileBtn" title="إرسال صورة"><svg class="ic"><use href="#i-clip"/></svg></button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <textarea id="ta" rows="1" placeholder="اكتب رسالة…"></textarea>
        <button class="roundbtn" id="sendBtn" title="إرسال"><svg class="ic"><use href="#i-send"/></svg></button>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="mConnect" hidden>
  <div class="modal">
    <button class="ibtn mx" id="mcClose"><svg class="ic"><use href="#i-x"/></svg></button>
    <h3>محادثة جديدة</h3>
    <p>أدخل معرّف الطرف الآخر — مثال: <b dir="ltr">823674190</b></p>
    <input id="mcInput" maxlength="9" inputmode="numeric" placeholder="123456789" autocomplete="off" spellcheck="false">
    <div class="merr" id="mcErr" hidden></div>
    <button class="mbtn" id="mcGo">اتصال</button>
  </div>
</div>

<div id="viewer" hidden><img id="viewerImg" alt="صورة"></div>
<div id="toasts"></div>

<script>
'use strict';
/* ================= أدوات ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

/* المعرّف: 9 أرقام مثل معرّفات الألعاب */
function genId(){
  const b = new Uint8Array(9);
  crypto.getRandomValues(b);
  let s = String((b[0] % 9) + 1); // لا يبدأ بصفر
  for (let i = 1; i < 9; i++) s += b[i] % 10;
  return s;
}
function normId(raw){
  const s = String(raw||'').replace(/\D/g,'');
  return (s.length === 9) ? s : null;
}
const timeFmt = t => new Date(t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const dayKey  = t => new Date(t).toDateString();
function dayLabel(t){
  const d = new Date(t), td = new Date(), y = new Date(Date.now()-864e5);
  if (d.toDateString() === td.toDateString()) return 'اليوم';
  if (d.toDateString() === y.toDateString())  return 'أمس';
  return d.toLocaleDateString('ar',{day:'numeric',month:'long'});
}
const AV = ['#1F7A5C','#B25A2A','#31456A','#6E4A2F','#4A5D23','#7C3A2D'];
const avColor = id => AV[[...id].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
const initial = n => [...String(n).trim()][0] || '؟';

/* ================= تخزين آمن: IndexedDB مع بديل localStorage ولا يعلّق أبداً ================= */
const db = {
  _d: undefined,
  _open(){
    if (this._d !== undefined) return Promise.resolve(this._d);
    return new Promise(res => {
      let done = false;
      const fin = v => { if (!done){ done = true; clearTimeout(to); this._d = v; res(v); } };
      const to = setTimeout(() => fin(null), 2500); // لا انتظار للأبد
      try {
        if (!window.indexedDB) return fin(null);
        const r = indexedDB.open('mirsal-db', 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore('kv'); } catch {} };
        r.onsuccess = () => fin(r.result);
        r.onerror = () => fin(null);
        r.onblocked = () => fin(null);
      } catch { fin(null); }
    });
  },
  async get(k){
    const d = await this._open();
    if (!d){ try { const v = localStorage.getItem('mirsal:'+k); return v ? JSON.parse(v) : null; } catch { return null; } }
    return new Promise(res => {
      try {
        const r = d.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result ?? null);
        r.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  async set(k,v){
    const d = await this._open();
    if (!d){ try { localStorage.setItem('mirsal:'+k, JSON.stringify(v)); } catch {} return; }
    return new Promise(res => {
      try {
        const tx = d.transaction('kv','readwrite');
        tx.objectStore('kv').put(v,k);
        tx.oncomplete = () => res();
        tx.onerror = tx.onabort = () => res();
      } catch { res(); }
    });
  },
  async del(k){
    const d = await this._open();
    if (!d){ try { localStorage.removeItem('mirsal:'+k); } catch {} return; }
    return new Promise(res => {
      try {
        const tx = d.transaction('kv','readwrite');
        tx.objectStore('kv').delete(k);
        tx.oncomplete = () => res();
        tx.onerror = tx.onabort = () => res();
      } catch { res(); }
    });
  },
  async all(){
    const d = await this._open();
    if (!d){
      const out = {};
      try {
        for (let i = 0; i < localStorage.length; i++){
          const key = localStorage.key(i);
          if (key && key.startsWith('mirsal:')){
            try { out[key.slice(7)] = JSON.parse(localStorage.getItem(key)); } catch {}
          }
        }
      } catch {}
      return out;
    }
    return new Promise(res => {
      const out = {};
      try {
        const r = d.transaction('kv').objectStore('kv').openCursor();
        r.onsuccess = e => { const c = e.target.result; if (c){ out[c.key] = c.value; c.continue(); } else res(out); };
        r.onerror = () => res(out);
      } catch { res(out); }
    });
  }
};

/* ================= الحالة ================= */
let me = null, chats = {}, activePid = null;
let peer = null, conns = new Map(), connecting = new Set();
let connectTimers = new Map(), retryTimers = new Map(), wantConnect = new Set();
let peerAttempt = 0, peerTimer = null, waitingModal = null, idRegens = 0;
let imgBufs = new Map(), lastDay = null, typingRow = null;
let typUntil = 0, typHideT = 0, lastTypeSent = 0;
const CHUNK = 60*1024;

const msgsEl = $('msgs');
function makeTyping(){
  typingRow = document.createElement('div');
  typingRow.className = 'msg in'; typingRow.hidden = true;
  typingRow.innerHTML = '<div class="bubble tdots"><span></span><span></span><span></span></div>';
}

const saveChat = pid => { if (chats[pid]) db.set('chat:'+pid, chats[pid]); };
function ensureChat(pid){
  if (!chats[pid]) chats[pid] = { pid, name:null, unread:0, created:Date.now(), last:0, messages:[] };
  return chats[pid];
}
const chatTitle = c => c.name || ('مراسل ' + c.pid.slice(-3));
const hasPendingWork = pid => {
  const c = chats[pid];
  return !!(c && c.messages.some(m => m.out && m.status === 'pending'));
};

/* ================= تنبيهات وصوت ================= */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3200);
}
let actx = null;
function tone(f, at, dur, vol=.12, type='sine'){
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .05);
  } catch {}
}
const beepIn  = () => { tone(620,0,.09); tone(880,.09,.16); };
const beepOut = () => tone(1150,0,.05,.06,'triangle');
const beepErr = () => tone(230,0,.2,.1,'square');

async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch {
    const x = document.createElement('textarea');
    x.value = t; document.body.appendChild(x); x.select();
    try { document.execCommand('copy'); } catch {}
    x.remove();
  }
  toast('نُسخ المعرّف');
}

/* ================= علامات الحالة ================= */
const ST_SVG = {
  pending:  '<svg class="st" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6v4.6l3 1.8"/></svg>',
  sent:     '<svg class="st" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.8 5.2 10.4 14.5 2"/></svg>',
  delivered:'<svg class="st" viewBox="0 0 21 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 7 5 10.5 13 2.5"/><path d="m8.5 7 3.5 3.5L20.5 2.5"/></svg>',
  seen:     '<svg class="st" viewBox="0 0 21 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 7 5 10.5 13 2.5"/><path d="m8.5 7 3.5 3.5L20.5 2.5"/></svg>'
};
function updateMsgDom(u, st){
  const w = document.querySelector(`.msg[data-uid="${u}"] .stwrap`);
  if (w){ w.dataset.st = st; w.innerHTML = ST_SVG[st]; }
}

/* ================= عرض الرسائل ================= */
function scrollBottom(force){
  requestAnimationFrame(()=>{
    const near = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 170;
    if (force || near) msgsEl.scrollTop = msgsEl.scrollHeight;
  });
}
function appendMsgDom(m){
  const dk = dayKey(m.time);
  if (dk !== lastDay){
    msgsEl.insertAdjacentHTML('beforeend', `<div class="dsep">${esc(dayLabel(m.time))}</div>`);
    lastDay = dk;
  }
  const div = document.createElement('div');
  div.className = 'msg ' + (m.out ? 'out' : 'in');
  div.dataset.uid = m.uid;
  const meta = `<div class="bmeta"><span>${timeFmt(m.time)}</span>${m.out ? `<span class="stwrap" data-st="${m.status}">${ST_SVG[m.status]}</span>` : ''}</div>`;
  if (m.kind === 'img'){
    div.innerHTML = `<div class="bubble imgb"><img class="bimg" alt="صورة">${meta}</div>`;
    const im = div.querySelector('.bimg');
    im.src = m.data;
    im.onclick = () => openViewer(m.data);
  } else {
    div.innerHTML = `<div class="bubble"><div class="btext"></div>${meta}</div>`;
    div.querySelector('.btext').textContent = m.text;
  }
  msgsEl.insertBefore(div, typingRow);
}
function renderMsgs(c){
  msgsEl.innerHTML = ''; lastDay = null;
  makeTyping();
  if (!c.messages.length)
    msgsEl.insertAdjacentHTML('beforeend','<div class="no-msgs">لا رسائل بعد — اكتب أول رسالة.</div>');
  c.messages.forEach(appendMsgDom);
  msgsEl.appendChild(typingRow);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

/* ================= القائمة والهيدر ================= */
function updateTitle(){
  const n = Object.values(chats).reduce((a,c)=>a+(c.unread||0),0);
  document.title = n ? `(${n}) مِرسال` : 'مِرسال';
}
function renderChatList(){
  const list = $('chatList'); list.innerHTML = '';
  const arr = Object.values(chats).sort((a,b)=>(b.last||b.created)-(a.last||a.created));
  if (!arr.length){ list.innerHTML = '<div class="list-empty">لا محادثات بعد</div>'; updateTitle(); return; }
  arr.forEach(c => {
    const last = c.messages[c.messages.length-1];
    const typing = (c.pid === activePid) && typUntil > Date.now();
    const el = document.createElement('button');
    el.className = 'chat-item' + (c.pid === activePid ? ' active' : '');
    el.innerHTML = `
      <span class="avatar" style="background:${avColor(c.pid)}">${esc(initial(chatTitle(c)))}</span>
      <span class="ci-main">
        <span class="ci-row1"><span class="ci-name">${esc(chatTitle(c))}</span><span class="ci-time">${last ? timeFmt(last.time) : ''}</span></span>
        <span class="ci-row2">${
          typing ? '<span class="tp">يكتب…</span>'
          : last ? `${last.out ? `<span class="stwrap" data-st="${last.status}">${ST_SVG[last.status]}</span>` : ''}<span>${esc(last.kind==='img' ? 'صورة' : last.text)}</span>`
          : '<span>محادثة جديدة</span>'
        }</span>
      </span>
      ${c.unread ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}`;
    el.onclick = () => openChat(c.pid);
    list.appendChild(el);
  });
  updateTitle();
}
function renderHeader(){
  if (!activePid) return;
  const c = chats[activePid]; if (!c) return;
  const a = $('cAvatar');
  a.textContent = initial(chatTitle(c));
  a.style.background = avColor(c.pid);
  $('cName').textContent = chatTitle(c);
  const dot = $('cDot'), st = $('cStatText');
  st.className = '';
  if (typUntil > Date.now()){ dot.className = 'dot wait'; st.textContent = 'يكتب الآن…'; st.className = 'typing'; }
  else {
    const conn = conns.get(c.pid);
    if (conn && conn.open){ dot.className = 'dot on'; st.textContent = 'متصل الآن'; }
    else if (connecting.has(c.pid) || !peer || !peer.open){ dot.className = 'dot wait'; st.textContent = 'جارٍ الاتصال…'; }
    else { dot.className = 'dot off'; st.textContent = 'غير متصل — تُرسل الرسائل عند توفره'; }
  }
}
function openChat(pid){
  const c = chats[pid]; if (!c) return;
  activePid = pid; typUntil = 0;
  c.unread = 0; saveChat(pid);
  $('empty').hidden = true; $('conv').hidden = false;
  renderHeader(); renderMsgs(c); renderChatList();
  document.body.classList.add('in-chat');
  sendSeenAll(pid);
  setTimeout(()=> $('ta').focus(), 60);
}
function sendSeenAll(pid){
  const c = chats[pid]; if (!c) return;
  const uids = c.messages.filter(m=>!m.out).map(m=>m.uid).slice(-80);
  if (uids.length) sendAck(pid, { k:'seen', uids });
}
function sendAck(pid, payload){
  const c = conns.get(pid);
  if (c && c.open){ try { c.send(payload); } catch {} }
}

/* ================= الاتصال (PeerJS) ================= */
function setNet(s){
  const m = { online:'متصل', connecting:'جارٍ الاتصال…', offline:'غير متصل' };
  $('netDot').className = 'dot ' + (s==='online'?'on':s==='connecting'?'wait':'off');
  $('netText').textContent = m[s];
}
function startPeer(){
  clearTimeout(peerTimer);
  if (peer){ try { peer.destroy(); } catch {} peer = null; }
  conns.forEach(c => { try { c.close(); } catch {} }); conns.clear();
  connecting.clear();
  connectTimers.forEach(t => clearTimeout(t)); connectTimers.clear();
  retryTimers.forEach(t => clearTimeout(t)); retryTimers.clear();
  if (typeof Peer === 'undefined'){ setNet('offline'); schedulePeer(); return; }
  setNet('connecting');
  try { peer = new Peer(me.id, { debug:0 }); } catch { schedulePeer(); return; }
  peer.on('open', () => {
    peerAttempt = 0; setNet('online');
    const w = [...wantConnect]; wantConnect.clear();
    w.forEach(tryConnect);
    Object.values(chats).forEach(c => { if (hasPendingWork(c.pid)) tryConnect(c.pid); });
  });
  peer.on('connection', attachConn);
  peer.on('disconnected', () => {
    setNet('connecting');
    const re = () => { try { peer && peer.reconnect(); } catch {} };
    re();
    setTimeout(()=>{ if (peer && !peer.open){ if (conns.size === 0) startPeer(); else re(); } }, 4000);
  });
  peer.on('error', err => {
    const t = err && err.type;
    if (t === 'unavailable-id'){ // نادر جداً: المعرّف محجوز — نولّد غيره
      if (++idRegens > 3){ setNet('offline'); return; }
      me.id = genId();
      db.set('me', me);
      renderProfile();
      toast('تم توليد معرّف جديد لك: ' + me.id, 'err');
      schedulePeer();
      return;
    }
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed'){ schedulePeer(); return; }
    if (t === 'browser-incompatible'){ setNet('offline'); return; }
    if (t === 'peer-unavailable'){
      const m = (err.message||'').match(/\d{9}/);
      failConn(m ? m[0] : null, 'لا يوجد مراسل بهذا المعرّف الآن.');
    }
  });
}
function schedulePeer(){
  setNet('connecting');
  const d = Math.min(1500 * Math.pow(2, peerAttempt++), 12000);
  clearTimeout(peerTimer);
  peerTimer = setTimeout(startPeer, d);
}
function setConnTimer(pid, fn, ms){
  const old = connectTimers.get(pid); if (old) clearTimeout(old);
  connectTimers.set(pid, setTimeout(()=>{ connectTimers.delete(pid); fn(); }, ms));
}
function tryConnect(pid){
  if (!pid || pid === me.id) return;
  const ex = conns.get(pid); if (ex && ex.open) return;
  if (connecting.has(pid)) return;
  if (!peer || !peer.open){
    wantConnect.add(pid);
    if (waitingModal === pid) setConnTimer(pid, ()=> failConn(pid, 'تعذّر الاتصال بالشبكة — حاول مجدداً.'), 20000);
    if (activePid === pid) renderHeader();
    return;
  }
  connecting.add(pid);
  let conn;
  try { conn = peer.connect(pid, { reliable:true, metadata:{ from: me.id } }); }
  catch { connecting.delete(pid); failConn(pid, 'تعذّر بدء الاتصال.'); return; }
  attachConn(conn);
  setConnTimer(pid, ()=>{ if (!((conns.get(pid)||{}).open)) failConn(pid, 'لم يستجب الطرف الآخر — تأكد من صحة المعرّف ومن أن الطرف الآخر مفتوح على التطبيق.'); }, 14000);
  if (activePid === pid) renderHeader();
}
function failConn(pid, userMsg){
  if (pid){
    connecting.delete(pid);
    const t = connectTimers.get(pid); if (t){ clearTimeout(t); connectTimers.delete(pid); }
  }
  if (waitingModal === pid){
    $('mcErr').textContent = userMsg || 'تعذّر الوصول إلى هذا المعرّف.';
    $('mcErr').hidden = false;
    $('mcGo').textContent = 'اتصال'; $('mcGo').disabled = false;
    waitingModal = null; beepErr();
  } else if (!pid && userMsg){ toast(userMsg, 'err'); }
  if (activePid === pid) renderHeader();
  if (pid && hasPendingWork(pid) && !retryTimers.has(pid))
    retryTimers.set(pid, setTimeout(()=>{ retryTimers.delete(pid); tryConnect(pid); }, 15000));
}
function attachConn(conn){
  const pid = conn.peer;
  conn.on('open', () => {
    conn._init = (conn.metadata && conn.metadata.from) ? String(conn.metadata.from) : me.id;
    const cur = conns.get(pid);
    if (cur && cur !== conn && cur.open){
      if (conn._init < cur._init){ try { cur.close(); } catch {} conns.set(pid, conn); bootConn(pid, conn); }
      else { try { conn.close(); } catch {} }
    } else {
      if (cur && cur !== conn){ try { cur.close(); } catch {} }
      conns.set(pid, conn); bootConn(pid, conn);
    }
  });
  conn.on('data', d => { if (conns.get(pid) === conn) onData(pid, d); });
  conn.on('close', () => { if (conns.get(pid) === conn){ conns.delete(pid); onConnClose(pid); } });
  conn.on('error', () => {});
}
function bootConn(pid, conn){
  try { conn.send({ t:'hello', name: me.name }); } catch {}
  onConnOpen(pid);
}
function onConnOpen(pid){
  connecting.delete(pid);
  const t = connectTimers.get(pid); if (t){ clearTimeout(t); connectTimers.delete(pid); }
  const r = retryTimers.get(pid); if (r){ clearTimeout(r); retryTimers.delete(pid); }
  setNet('online');
  const isNew = !chats[pid];
  ensureChat(pid);
  deliverPending(pid);
  saveChat(pid); renderChatList();
  if (waitingModal === pid){
    waitingModal = null; closeConnectModal();
    openChat(pid);
    toast('تم الاتصال بـ ' + chatTitle(chats[pid]));
  } else if (isNew && !activePid){
    openChat(pid);
    toast('محادثة جديدة مع ' + (chats[pid].name || 'مراسل'));
  }
  if (activePid === pid){ renderHeader(); sendSeenAll(pid); }
}
function onConnClose(pid){
  if (activePid === pid) renderHeader();
  for (const [k, b] of imgBufs) if (b.pid === pid) imgBufs.delete(k);
  if (hasPendingWork(pid) && !retryTimers.has(pid))
    retryTimers.set(pid, setTimeout(()=>{ retryTimers.delete(pid); tryConnect(pid); }, 3000));
}
function deliverPending(pid){
  const c = chats[pid]; if (!c) return;
  let any = false;
  c.messages.forEach(m => { if (m.out && m.status === 'pending' && sendMsgNow(pid, m)) any = true; });
  if (any) renderChatList();
}

/* ================= استقبال البيانات ================= */
function onData(pid, d){
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'hello': {
      const existed = !!chats[pid];
      const c = ensureChat(pid);
      const nm = String(d.name||'').trim().slice(0,24);
      if (nm) c.name = nm;
      saveChat(pid); renderChatList();
      if (activePid === pid) renderHeader();
      if (!existed){ toast(nm ? 'بدأ ' + nm + ' محادثة معك' : 'أحدهم بدأ محادثة معك'); beepIn(); }
      break;
    }
    case 'msg': {
      const c = ensureChat(pid);
      const mu = String(d.uid || uid());
      if (c.messages.some(x => x.uid === mu)){ sendAck(pid, { k:'delivered', uid: mu }); break; }
      const m = { uid: mu, kind:'text', text:String(d.text||'').slice(0,2000), time:+d.time||Date.now(), out:false, status:'seen' };
      addIncoming(c, m, pid);
      break;
    }
    case 'img-meta': {
      const size = +d.size || 0;
      if (size > 0 && size <= 8*1024*1024)
        imgBufs.set(String(d.uid), { pid, size, meta:{ uid:String(d.uid), w:+d.w||0, h:+d.h||0, time:+d.time||Date.now() }, parts:new Array(Math.ceil(size/CHUNK)) });
      break;
    }
    case 'img-chunk': {
      const b = imgBufs.get(String(d.uid)); if (!b) break;
      let u8 = d.data;
      if (u8 instanceof ArrayBuffer) u8 = new Uint8Array(u8);
      else if (u8.buffer) u8 = new Uint8Array(u8.buffer, u8.byteOffset||0, u8.byteLength);
      b.parts[+d.i] = u8;
      break;
    }
    case 'img-end': {
      const b = imgBufs.get(String(d.uid)); if (!b) break;
      imgBufs.delete(String(d.uid));
      const c = ensureChat(pid);
      if (c.messages.some(x => x.uid === b.meta.uid)){ sendAck(pid, { k:'delivered', uid:b.meta.uid }); break; }
      const full = new Uint8Array(b.size); let off = 0, ok = true;
      for (let i = 0; i < b.parts.length; i++){ const p = b.parts[i]; if (!p){ ok = false; break; } full.set(p, off); off += p.byteLength; }
      if (!ok) break;
      const fr = new FileReader();
      fr.onload = () => {
        const m = { uid:b.meta.uid, kind:'img', text:'', data:fr.result, w:b.meta.w, h:b.meta.h, time:b.meta.time, out:false, status:'seen' };
        addIncoming(c, m, pid);
      };
      fr.readAsDataURL(new Blob([full], { type:'image/jpeg' }));
      break;
    }
    case 'ack': {
      const k = d.k === 'seen' ? 'seen' : 'delivered';
      const uids = (d.uids && d.uids.length ? d.uids : [d.uid]).map(String);
      let changed = false;
      uids.forEach(u => {
        for (const c of Object.values(chats)){
          const m = c.messages.find(x => x.uid === u && x.out);
          if (m && m.status !== 'seen'){ m.status = k; updateMsgDom(u, k); saveChat(c.pid); changed = true; break; }
        }
      });
      if (changed) renderChatList();
      break;
    }
    case 'typing': {
      if (activePid !== pid) break;
      typUntil = Date.now() + 2600;
      renderHeader();
      if (typingRow) typingRow.hidden = false;
      scrollBottom();
      clearTimeout(typHideT);
      typHideT = setTimeout(()=>{ if (typingRow) typingRow.hidden = true; typUntil = 0; renderHeader(); }, 2600);
      break;
    }
  }
}
function addIncoming(c, m, pid){
  c.messages.push(m); c.last = m.time;
  if (c.messages.length > 300) c.messages.splice(0, c.messages.length - 300);
  const active = activePid === pid && !document.hidden;
  if (!active) c.unread++;
  saveChat(pid); renderChatList();
  if (activePid === pid){
    const nm = msgsEl.querySelector('.no-msgs'); if (nm) nm.remove();
    appendMsgDom(m); scrollBottom();
  }
  beepIn();
  if (!active) toast(chatTitle(c) + ': ' + (m.kind === 'img' ? 'صورة' : m.text.slice(0,60)));
  sendAck(pid, active ? { k:'seen', uids:[m.uid] } : { k:'delivered', uid:m.uid });
}

/* ================= الإرسال ================= */
function sendMsgNow(pid, m){
  const conn = conns.get(pid);
  if (!conn || !conn.open) return false;
  try {
    if (m.kind === 'text'){
      conn.send({ t:'msg', uid:m.uid, text:m.text, time:m.time });
    } else {
      conn.send({ t:'img-meta', uid:m.uid, w:m.w, h:m.h, size:m.size, time:m.time });
      const bytes = dataURLToBytes(m.data);
      for (let i = 0; i * CHUNK < bytes.length; i++)
        conn.send({ t:'img-chunk', uid:m.uid, i, data: bytes.slice(i*CHUNK, (i+1)*CHUNK).buffer });
      conn.send({ t:'img-end', uid:m.uid });
    }
  } catch { return false; }
  m.status = 'sent'; updateMsgDom(m.uid, 'sent'); saveChat(pid); beepOut(); renderChatList();
  return true;
}
function sendText(){
  const text = $('ta').value.trim();
  if (!text || !activePid) return;
  const c = chats[activePid];
  const m = { uid:uid(), kind:'text', text:text.slice(0,2000), time:Date.now(), out:true, status:'pending' };
  c.messages.push(m); c.last = m.time;
  if (c.messages.length > 300) c.messages.splice(0, c.messages.length - 300);
  saveChat(activePid);
  $('ta').value = ''; taResize();
  const nm = msgsEl.querySelector('.no-msgs'); if (nm) nm.remove();
  appendMsgDom(m); scrollBottom(); renderChatList();
  const conn = conns.get(activePid);
  if (conn && conn.open) sendMsgNow(activePid, m);
  else tryConnect(activePid);
}

/* ================= الصور ================= */
function dataURLToBytes(u){
  const b = atob(u.split(',')[1]);
  const a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function compressImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const MAX = 1280;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) throw 0;
        if (w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res({ data: cv.toDataURL('image/jpeg', 0.75), w, h });
      } catch { URL.revokeObjectURL(url); rej(); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
 $('fileBtn').addEventListener('click', () => $('fileInput').click());
 $('fileInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!activePid){ toast('افتح محادثة أولاً', 'err'); return; }
  if (!f.type.startsWith('image/')){ toast('يمكن إرسال الصور فقط', 'err'); return; }
  let c; try { c = await compressImage(f); } catch { toast('تعذّر قراءة الصورة', 'err'); return; }
  const bytes = dataURLToBytes(c.data);
  const chat = chats[activePid];
  const m = { uid:uid(), kind:'img', text:'', data:c.data, w:c.w, h:c.h, size:bytes.length, time:Date.now(), out:true, status:'pending' };
  chat.messages.push(m); chat.last = m.time;
  if (chat.messages.length > 300) chat.messages.splice(0, chat.messages.length - 300);
  saveChat(activePid);
  const nm = msgsEl.querySelector('.no-msgs'); if (nm) nm.remove();
  appendMsgDom(m); scrollBottom(); renderChatList();
  const conn = conns.get(activePid);
  if (conn && conn.open) sendMsgNow(activePid, m);
  else tryConnect(activePid);
});
function openViewer(src){ $('viewerImg').src = src; $('viewer').hidden = false; }
 $('viewer').addEventListener('click', () => { $('viewer').hidden = true; $('viewerImg').src = ''; });

/* ================= البروفايل والدخول ================= */
function renderProfile(){
  $('pfAvatar').textContent = initial(me.name);
  $('pfAvatar').style.background = avColor(me.id);
  $('pfName').textContent = me.name;
  $('pfId').textContent = me.id;
}
function enterApp(){
  $('welcome').hidden = true; $('app').hidden = false;
  renderProfile(); renderChatList(); setNet('connecting');
  startPeer();
}
 $('wForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('wName').value.trim();
  if (v.length < 2){
    $('wErr').hidden = false;
    $('wName').classList.add('shake');
    setTimeout(()=> $('wName').classList.remove('shake'), 400);
    return;
  }
  $('wErr').hidden = true;
  me = { name: v.slice(0,24), id: genId() };
  enterApp();                       // الدخول فوري — لا يعتمد على التخزين
  db.set('me', me);                 // الحفظ في الخلفية
});
(async function init(){
  try {
    const saved = await db.get('me');
    if (saved && saved.name){
      const numeric = /^\d{9}$/.test(String(saved.id||''));
      me = { name: String(saved.name), id: numeric ? String(saved.id) : genId() };
      const all = await db.all();
      for (const k in all) if (k.startsWith('chat:')) chats[k.slice(5)] = all[k];
      Object.values(chats).forEach(c => c.messages.forEach(m => { if (m.out && m.status !== 'seen') m.status = 'pending'; }));
      enterApp();
      if (!numeric){
        db.set('me', me);
        toast('تم تحديث معرّفك إلى الصيغة الرقمية: ' + me.id);
      }
    }
  } catch {}
})();

/* ================= أحداث الواجهة ================= */
const ta = $('ta');
function taResize(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
ta.addEventListener('input', () => {
  taResize();
  const c = activePid && conns.get(activePid);
  if (c && c.open && Date.now() - lastTypeSent > 1500){ try { c.send({ t:'typing' }); lastTypeSent = Date.now(); } catch {} }
});
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } });
 $('sendBtn').addEventListener('click', sendText);

 $('newChatBtn').addEventListener('click', openConnectModal);
 $('emptyNewBtn').addEventListener('click', openConnectModal);
 $('mcClose').addEventListener('click', closeConnectModal);
 $('mConnect').addEventListener('click', e => { if (e.target === $('mConnect')) closeConnectModal(); });
 $('mcInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,9); });
 $('mcInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('mcGo').click(); });
 $('mcGo').addEventListener('click', () => {
  const pid = normId($('mcInput').value);
  if (!pid){ $('mcErr').textContent = 'أدخل معرّفاً صحيحاً من 9 أرقام.'; $('mcErr').hidden = false; return; }
  if (pid === me.id){ $('mcErr').textContent = 'هذا معرّفك أنت — شاركه مع الطرف الآخر ليكتب إليك.'; $('mcErr').hidden = false; return; }
  $('mcErr').hidden = true;
  $('mcGo').textContent = 'جارٍ الاتصال…'; $('mcGo').disabled = true;
  waitingModal = pid;
  const c = conns.get(pid);
  if (c && c.open) onConnOpen(pid); else tryConnect(pid);
});
function openConnectModal(){
  $('mConnect').hidden = false;
  $('mcInput').value = ''; $('mcErr').hidden = true;
  $('mcGo').textContent = 'اتصال'; $('mcGo').disabled = false;
  waitingModal = null;
  setTimeout(()=> $('mcInput').focus(), 60);
}
function closeConnectModal(){ $('mConnect').hidden = true; waitingModal = null; }

 $('backBtn').addEventListener('click', () => document.body.classList.remove('in-chat'));
 $('clearBtn').addEventListener('click', () => {
  if (!activePid) return;
  if (!confirm('مسح سجل هذه المحادثة من جهازك؟')) return;
  chats[activePid].messages = []; chats[activePid].unread = 0; chats[activePid].last = 0;
  saveChat(activePid); renderMsgs(chats[activePid]); renderChatList();
});
 $('logoutBtn').addEventListener('click', async () => {
  if (!confirm('تسجيل الخروج ومسح جميع البيانات من هذا المتصفح؟')) return;
  try { peer && peer.destroy(); } catch {}
  try {
    const all = await db.all();
    for (const k in all) await db.del(k);
  } catch {}
  location.reload();
});
 $('copyIdBtn').addEventListener('click', () => copyText(me.id));

 $('editNameBtn').addEventListener('click', () => {
  const inp = $('pfNameInput');
  $('pfName').hidden = true; inp.hidden = false;
  inp.value = me.name; inp.focus(); inp.select();
});
function commitName(){
  const inp = $('pfNameInput');
  if (inp.hidden) return;
  const v = inp.value.trim();
  if (v.length >= 2 && v !== me.name){
    me.name = v.slice(0,24);
    db.set('me', me);
    conns.forEach(c => { if (c.open){ try { c.send({ t:'hello', name: me.name }); } catch {} } });
    renderProfile(); renderChatList();
    if (activePid) renderHeader();
  }
  inp.hidden = true; $('pfName').hidden = false;
}
 $('pfNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape'){ e.target.value = me.name; e.target.blur(); } });
 $('pfNameInput').addEventListener('blur', commitName);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && activePid && chats[activePid]){
    const c = chats[activePid];
    if (c.unread){ c.unread = 0; saveChat(activePid); renderChatList(); }
    sendSeenAll(activePid);
  }
});
</script>
</body>
</html>
