<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- إطار موقع كيك الأساسي -->
    <iframe id="kickSite" src="https://kick.com" allow="autoplay; fullscreen; clipboard-write; popups" allowfullscreen></iframe>

    <!-- زر الصاعقة العائم -->
    <button class="float-btn" id="openPanelBtn">⚡</button>

    <!-- لوحة التحكم بالتفاعل -->
    <div class="panel" id="controlPanel">
        <div class="panel-header">
            <h2>لوحة التفاعل</h2>
            <button class="close-btn" id="closePanelBtn">✕</button>
        </div>

        <!-- قسم تسجيل الدخول (يظهر إذا لم يكن مسجل) -->
        <div id="loginSection">
            <button class="kick-login-btn" id="loginBtn">تسجيل الدخول بحساب كيك</button>
            <p class="note">يجب تسجيل الدخول لتفعيل إرسال الرسائل</p>
        </div>

        <!-- قسم البوت (يظهر بعد تسجيل الدخول) -->
        <div id="botSection" style="display: none;">
            <div class="input-group">
                <label>اسم القناة (بدون @)</label>
                <input type="text" id="channelName" placeholder="مثال: xqc">
            </div>
            
            <div class="input-group">
                <label>الرسائل (رسالة في كل سطر)</label>
                <textarea id="messagesList" rows="4" placeholder="مرحبا بالجميع&#10;بث رائع&#10;كيف الحال"></textarea>
            </div>

            <div class="input-group">
                <label>مؤقت التهدئة (بالثواني)</label>
                <input type="number" id="cooldownSec" value="5" min="1">
            </div>

            <div class="action-btns">
                <button class="start-btn" id="startBtn">تشغيل البوت</button>
                <button class="stop-btn" id="stopBtn" style="display: none;">إيقاف البوت</button>
            </div>
        </div>

        <!-- سجل التشغيل -->
        <div class="log-box" id="logBox">جاهز للعمل...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
