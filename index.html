<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مِرسال</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231F7A5C' d='m22 2-7 20-4-9-9-4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EFEAE2;--panel:#FFF;--line:#E2E0DA;--ink:#111B21;--mut:#667781;--out:#D9FDD3;--acc:#1F7A5C;--err:#B3452F;--seen:#34B7F1}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#B7BDB9;flex:none}
.dot.on{background:#2EBD71}.dot.wait{background:#E2A03F}.dot.off{background:#D9534F}

/* دخول */
#welcome{height:100dvh;display:grid;place-items:center;background:#F7F5F0;padding:20px}
.wcard{width:min(350px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.wtitle{font-size:30px;font-weight:700;color:var(--acc)}
.wsub{color:var(--mut);font-size:13.5px;margin:6px 0 22px;line-height:1.7}
#wName{width:100%;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;text-align:center}
#wName:focus{border-color:var(--acc)}
.wbtn{width:100%;margin-top:12px;background:var(--acc);color:#fff;border-radius:12px;padding:12px;font-size:15.5px;font-weight:600}
.wbtn:active{transform:translateY(1px)}
.werr{color:var(--err);font-size:12.5px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(4px)}}

/* التطبيق */
#app{height:100dvh;display:flex}
#side{width:340px;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;padding-inline-end:60px;border-bottom:1px solid var(--line)}
.sbrand{font-weight:700;font-size:18px;color:var(--acc)}
.net{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.pf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;user-select:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.big{width:92px;height:92px;font-size:34px}
.pf-main{flex:1;min-width:0}
.pf-namewrap{display:flex;align-items:center;gap:4px;min-width:0}
#pfName{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
#pfNameInput{font:inherit;font-size:13px;border:1.5px solid var(--acc);border-radius:7px;padding:2px 6px;width:118px;outline:none}
.pf-id{font-size:12px;letter-spacing:1px;color:var(--acc);direction:ltr;text-align:right;font-weight:700}
.ibtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:none}
.ibtn:hover{background:#F0F2F5;color:var(--ink)}
.ibtn .ic{width:17px;height:17px}
#newChatBtn{margin:10px 14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--acc);color:#fff;border-radius:11px;font-weight:600;font-size:14.5px}
#newChatBtn:active{transform:translateY(1px)}
#chatList{flex:1;overflow-y:auto}
.list-empty{padding:30px 16px;text-align:center;color:var(--mut);font-size:13px}
.chat-item{display:flex;gap:10px;width:100%;text-align:start;padding:10px 14px;border-bottom:1px solid #F0EDE7;align-items:center;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chat-item:hover{background:#F7F6F2}
.chat-item.active{background:#F0F2F5}
.ci-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ci-row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-time{font-size:10.5px;color:var(--mut);flex:none}
.ci-row2{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--mut);min-width:0}
.ci-row2 .st{width:15px;height:11px}
.ci-row2 span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp{color:var(--acc);font-weight:600}
.badge{background:#2EBD71;color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 6px;flex:none}
.sb-foot{padding:9px;border-top:1px solid var(--line);text-align:center}
.danger{color:var(--err);font-size:12px}
.danger:hover{text-decoration:underline}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#conv{flex:1;display:flex;flex-direction:column;min-height:0}
.chead{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-inline-end:60px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:none}
.cmeta{flex:1;min-width:0}
.cname{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cstat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.cstat .typing{color:var(--acc);font-weight:600}
#msgs{flex:1;overflow-y:auto;padding:18px clamp(12px,4%,40px) 12px;display:flex;flex-direction:column}
.msg{display:flex;margin-top:2px;animation:pop .15s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.msg.out{justify-content:flex-end}
.bubble{max-width:min(75%,520px);padding:7px 10px 5px;border-radius:10px;background:var(--panel);box-shadow:0 1px .5px rgba(11,20,26,.13)}
.msg.out .bubble{background:var(--out)}
.bubble.imgb{padding:3px}
.btext{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.bimg{display:block;max-width:min(260px,100%);border-radius:8px;cursor:zoom-in}
.bmeta{display:flex;gap:4px;justify-content:flex-end;align-items:center;font-size:10.5px;color:var(--mut);margin-top:1px;padding:0 2px 1px}
.msg.out .bmeta{color:#5A7266}
.stwrap{display:inline-flex;color:#8696A0}
.msg.out .stwrap[data-st="seen"]{color:var(--seen)}
.st{width:16px;height:12px}
.dsep{align-self:center;margin:12px 0 8px;font-size:11px;color:var(--mut);background:rgba(255,255,255,.9);padding:3px 12px;border-radius:99px;box-shadow:0 1px .5px rgba(11,20,26,.1)}
.no-msgs{margin:auto;color:var(--mut);font-size:13px;text-align:center;max-width:320px;line-height:1.8;border:1.5px dashed #C9C5BC;padding:14px 20px;border-radius:12px;background:rgba(255,255,255,.6)}
.tdots{display:flex;gap:4px;padding:12px 14px;align-items:center}
.tdots span{width:6px;height:6px;border-radius:50%;background:#8696A0;animation:tb 1s infinite}
.tdots span:nth-child(2){animation-delay:.15s}.tdots span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:9px 12px;background:var(--panel);border-top:1px solid var(--line)}
#ta{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 15px;font-size:15px;max-height:120px;outline:none;line-height:1.5;background:var(--panel)}
#ta:focus{border-color:var(--acc)}
.roundbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
#fileBtn{color:var(--mut)}
#fileBtn:hover{background:#F0F2F5}
#sendBtn{background:var(--acc);color:#fff}
#sendBtn:active{transform:translateY(1px)}

/* زر الإعدادات — الزاوية اليسرى العليا */
#settingsBtn{position:fixed;top:12px;left:12px;z-index:26;width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 5px rgba(0,0,0,.1);display:grid;place-items:center;color:var(--mut)}
#settingsBtn:hover{color:var(--ink)}

/* النوافذ */
.overlay{position:fixed;inset:0;background:rgba(11,20,26,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:min(400px,100%);position:relative;animation:mIn .2s ease;max-height:86vh;overflow-y:auto}
@keyframes mIn{from{transform:translateY(12px);opacity:0}}
.modal h3{font-size:19px;margin-bottom:4px}
.modal>p{color:var(--mut);font-size:13px;line-height:1.7;margin-bottom:14px}
.mx{position:absolute;top:10px;inset-inline-start:10px}
#mcInput{width:100%;font-size:18px;font-weight:700;letter-spacing:3px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;text-align:center;direction:ltr}
#mcInput:focus{border-color:var(--acc)}
.mbtn{width:100%;margin-top:12px;background:var(--acc);color:#fff;border-radius:11px;padding:11px;font-weight:600;font-size:15px}
.mbtn:disabled{opacity:.6;cursor:default}
.merr{color:var(--err);font-size:12.5px;margin-top:9px;line-height:1.6}
.dbtns{display:flex;gap:10px;margin-top:14px}
.dbtns .mbtn{margin-top:0}
.btn-red{background:var(--err)}

/* الإعدادات */
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FAFAF8;margin-top:12px}
.setrow:hover{background:#F0F2F5}
.setrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.setrow-t{font-weight:600;font-size:14.5px}
.setrow-s{font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:end}
.chev{width:16px;height:16px;color:var(--mut)}
.acc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.acc-head h3{margin:0}
.acc-av{position:relative;width:92px;margin:10px auto 4px;cursor:pointer}
.acc-av .avatar{margin:0 auto;display:grid}
.acc-cam{position:absolute;bottom:-2px;left:-2px;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.acc-cam .ic{width:14px;height:14px}
.acc-hint{text-align:center;font-size:11.5px;color:var(--mut);margin-bottom:8px}
.acc-label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
#accName{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none}
#accName:focus{border-color:var(--acc)}
.acc-id{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px dashed #C9C5BC;border-radius:10px;padding:8px 12px}
#accId{font-weight:700;letter-spacing:2px;color:var(--acc);font-size:16px}

#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:grid;place-items:center;cursor:zoom-out}
#viewer img{max-width:94vw;max-height:94vh;border-radius:6px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#233138;color:#E9EDEF;padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px);transition:.25s;max-width:100%;text-align:center}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--err)}

@media(max-width:820px){
 #side{width:100%;border-inline-end:none}
 #conv{position:fixed;inset:0;z-index:20;display:none}
 body.in-chat #conv{display:flex}
 body.in-chat #side{display:none}
 .back{display:grid}
 .bubble{max-width:84%}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
</defs></svg>

<section id="welcome">
  <form class="wcard" id="wForm" novalidate>
    <div class="wtitle">مِرسال</div>
    <p class="wsub">راسل أي شخص بمعرّفه — تصل رسائلك حتى لو كان غير متصل.<br>أدخل اسمك للبدء.</p>
    <input id="wName" maxlength="24" autocomplete="off" placeholder="اسمك">
    <button class="wbtn" type="submit">دخول</button>
    <p class="werr" id="wErr" hidden>اكتب اسماً من حرفين على الأقل.</p>
  </form>
</section>

<div id="app" hidden>
  <button id="settingsBtn" title="الإعدادات"><svg class="ic"><use href="#i-gear"/></svg></button>

  <aside id="side">
    <div class="shead">
      <span class="sbrand">مِرسال</span>
      <span class="net"><span class="dot wait" id="netDot"></span><span id="netText">…</span></span>
    </div>
    <div class="pf">
      <span class="avatar" id="pfAvatar">؟</span>
      <div class="pf-main">
        <div class="pf-namewrap">
          <span id="pfName"></span><input id="pfNameInput" hidden maxlength="24">
          <button class="ibtn" id="editNameBtn" title="تعديل الاسم"><svg class="ic"><use href="#i-pencil"/></svg></button>
        </div>
        <div class="pf-id" id="pfId" dir="ltr"></div>
      </div>
      <button class="ibtn" id="copyIdBtn" title="نسخ المعرّف"><svg class="ic"><use href="#i-copy"/></svg></button>
    </div>
    <button id="newChatBtn"><svg class="ic"><use href="#i-plus"/></svg>محادثة جديدة</button>
    <div id="chatList"></div>
    <div class="sb-foot"><button class="danger" id="logoutBtn">تسجيل الخروج ومسح البيانات</button></div>
  </aside>

  <main id="main">
    <section id="conv" hidden>
      <header class="chead">
        <button class="ibtn back" id="backBtn"><svg class="ic"><use href="#i-back"/></svg></button>
        <span class="avatar sm" id="cAvatar">؟</span>
        <div class="cmeta">
          <div class="cname" id="cName"></div>
          <div class="cstat"><span class="dot" id="cDot"></span><span id="cStatText"></span></div>
        </div>
        <button class="ibtn" id="clearBtn" title="مسح المحادثة"><svg class="ic"><use href="#i-trash"/></svg></button>
      </header>
      <div id="msgs"></div>
      <div class="composer">
        <button class="roundbtn" id="fileBtn" title="إرسال صورة"><svg class="ic"><use href="#i-clip"/></svg></button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <textarea id="ta" rows="1" placeholder="اكتب رسالة…"></textarea>
        <button class="roundbtn" id="sendBtn" title="إرسال"><svg class="ic"><use href="#i-send"/></svg></button>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="mConnect" hidden>
  <div class="modal">
    <button class="ibtn mx" id="mcClose"><svg class="ic"><use href="#i-x"/></svg></button>
    <h3>محادثة جديدة</h3>
    <p>أدخل معرّف الطرف الآخر — مثال: <b dir="ltr">823674190</b></p>
    <input id="mcInput" maxlength="9" inputmode="numeric" placeholder="123456789" autocomplete="off" spellcheck="false">
    <div class="merr" id="mcErr" hidden></div>
    <button class="mbtn" id="mcGo">بدء المحادثة</button>
  </div>
</div>

<div class="overlay" id="mDelete" hidden>
  <div class="modal">
    <button class="ibtn mx" id="mdClose"><svg class="ic"><use href="#i-x"/></svg></button>
    <h3>حذف المحادثة</h3>
    <p>سيُحذف سجل محادثة «<span id="mdName"></span>» من جهازك نهائياً.</p>
    <div class="dbtns">
      <button class="mbtn btn-red" id="mdYes">حذف</button>
      <button class="mbtn" id="mdNo" style="background:#E5E7EB;color:var(--ink)">إلغاء</button>
    </div>
  </div>
</div>

<div class="overlay" id="mSettings" hidden>
  <div class="modal">
    <button class="ibtn mx" id="setClose"><svg class="ic"><use href="#i-x"/></svg></button>

    <div id="viewList">
      <h3>الإعدادات</h3>
      <button class="setrow" id="rowAccount">
        <span class="avatar sm" id="rowAvatar">؟</span>
        <span class="setrow-main">
          <span class="setrow-t">حسابي</span>
          <span class="setrow-s" id="rowSub"></span>
        </span>
        <svg class="ic chev"><use href="#i-chev"/></svg>
      </button>
    </div>

    <div id="viewAccount" hidden>
      <div class="acc-head">
        <button class="ibtn" id="accBack"><svg class="ic"><use href="#i-back"/></svg></button>
        <h3>حسابي</h3>
      </div>
      <div class="acc-av" id="accAvWrap" title="تغيير الصورة">
        <span class="avatar big" id="accAvatar">؟</span>
        <span class="acc-cam"><svg class="ic"><use href="#i-cam"/></svg></span>
      </div>
      <div class="acc-hint">اضغط على الصورة لتغييرها</div>
      <label class="acc-label" for="accName">الاسم</label>
      <input id="accName" maxlength="24" autocomplete="off">
      <label class="acc-label">المعرّف</label>
      <div class="acc-id">
        <span id="accId" dir="ltr"></span>
        <button class="ibtn" id="accCopy" title="نسخ المعرّف"><svg class="ic"><use href="#i-copy"/></svg></button>
      </div>
    </div>
  </div>
  <input type="file" id="avatarInput" accept="image/*" hidden>
</div>

<div id="viewer" hidden><img id="viewerImg" alt="صورة"></div>
<div id="toasts"></div>

<script>
'use strict';
/* ================= أدوات ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

/* المعرّف: 9 أرقام، يُولَّد مرة واحدة مع إنشاء الحساب ولا يتغيّر أبداً */
function genId(){
  const b = new Uint8Array(9);
  crypto.getRandomValues(b);
  let s = String((b[0] % 9) + 1);
  for (let i = 1; i < 9; i++) s += b[i] % 10;
  return s;
}
function normId(raw){
  const s = String(raw||'').replace(/\D/g,'');
  return (s.length === 9) ? s : null;
}
const timeFmt = t => new Date(t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const dayKey  = t => new Date(t).toDateString();
function dayLabel(t){
  const d = new Date(t), td = new Date(), y = new Date(Date.now()-864e5);
  if (d.toDateString() === td.toDateString()) return 'اليوم';
  if (d.toDateString() === y.toDateString())  return 'أمس';
  return d.toLocaleDateString('ar',{day:'numeric',month:'long'});
}
const AV = ['#1F7A5C','#B25A2A','#31456A','#6E4A2F','#4A5D23','#7C3A2D'];
const avColor = id => AV[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
const initial = n => [...String(n).trim()][0] || '؟';

/* ================= تخزين آمن: IndexedDB مع بديل localStorage ================= */
const db = {
  _d: undefined,
  _open(){
    if (this._d !== undefined) return Promise.resolve(this._d);
    return new Promise(res => {
      let done = false;
      const fin = v => { if (!done){ done = true; clearTimeout(to); this._d = v; res(v); } };
      const to = setTimeout(() => fin(null), 2500);
      try {
        if (!window.indexedDB) return fin(null);
        const r = indexedDB.open('mirsal-db', 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore('kv'); } catch {} };
        r.onsuccess = () => fin(r.result);
        r.onerror = () => fin(null);
        r.onblocked = () => fin(null);
      } catch { fin(null); }
    });
  },
  async get(k){
    const d = await this._open();
    if (!d){ try { const v = localStorage.getItem('mirsal:'+k); return v ? JSON.parse(v) : null; } catch { return null; } }
    return new Promise(res => {
      try {
        const r = d.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = () => res(r.result ?? null);
        r.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  async set(k,v){
    const d = await this._open();
    if (!d){ try { localStorage.setItem('mirsal:'+k, JSON.stringify(v)); } catch {} return; }
    return new Promise(res => {
      try {
        const tx = d.transaction('kv','readwrite');
        tx.objectStore('kv').put(v,k);
        tx.oncomplete = () => res();
        tx.onerror = tx.onabort = () => res();
      } catch { res(); }
    });
  },
  async del(k){
    const d = await this._open();
    if (!d){ try { localStorage.removeItem('mirsal:'+k); } catch {} return; }
    return new Promise(res => {
      try {
        const tx = d.transaction('kv','readwrite');
        tx.objectStore('kv').delete(k);
        tx.oncomplete = () => res();
        tx.onerror = tx.onabort = () => res();
      } catch { res(); }
    });
  },
  async all(){
    const d = await this._open();
    if (!d){
      const out = {};
      try {
        for (let i = 0; i < localStorage.length; i++){
          const key = localStorage.key(i);
          if (key && key.startsWith('mirsal:')){
            try { out[key.slice(7)] = JSON.parse(localStorage.getItem(key)); } catch {}
          }
        }
      } catch {}
      return out;
    }
    return new Promise(res => {
      const out = {};
      try {
        const r = d.transaction('kv').objectStore('kv').openCursor();
        r.onsuccess = e => { const c = e.target.result; if (c){ out[c.key] = c.value; c.continue(); } else res(out); };
        r.onerror = () => res(out);
      } catch { res(out); }
    });
  }
};

/* ================= الحالة ================= */
let me = null, chats = {}, activePid = null;
let client = null, brokerUp = false, mqttRetry = null;
let imgBufs = new Map(), lastDay = null, typingRow = null;
let typUntil = 0, typHideT = 0, lastTypeSent = 0;

/* مواضيع MQTT: صندوق وارد + إشعارات قراءة + حضور + يكتب الآن
   الرسائل تُنشر بحالة Retained: يخزنها الوسيط حتى لو كان المستقبل مغلق
   ويُسلّمها فور اشتراكه — ثم يُمسح الموضوع من الوسيط بعد الاستلام */
const T = {
  inbox:  id => 'mirsal/in/'  + id,          // + /{uid}
  ack:    id => 'mirsal/ack/' + id,          // + /{uid}
  pres:   id => 'mirsal/pres/'  + id,
  typ:    id => 'mirsal/typing/' + id
};

const msgsEl = $('msgs');
function makeTyping(){
  typingRow = document.createElement('div');
  typingRow.className = 'msg in'; typingRow.hidden = true;
  typingRow.innerHTML = '<div class="bubble tdots"><span></span><span></span><span></span></div>';
}

const saveChat = pid => { if (chats[pid]) db.set('chat:'+pid, chats[pid]); };
function ensureChat(pid){
  if (!chats[pid]) chats[pid] = { pid, name:null, avatar:null, unread:0, created:Date.now(), last:0, messages:[], pres:null };
  if (client && client.connected){ try { client.subscribe(T.pres(pid), {qos:0}); } catch {} }
  return chats[pid];
}
const chatTitle = c => c.name || ('مراسل ' + c.pid.slice(-3));

/* ================= الصور الرمزية ================= */
function paintAvatar(el, name, av, id){
  if (av) el.innerHTML = '<img alt="" src="' + esc(av) + '">';
  else { el.textContent = initial(name); el.style.background = avColor(id || name || 'x'); }
}

/* ================= تنبيهات وصوت ================= */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 3200);
}
let actx = null;
function tone(f, at, dur, vol=.12, type='sine'){
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .05);
  } catch {}
}
const beepIn  = () => { tone(620,0,.09); tone(880,.09,.16); };
const beepOut = () => tone(1150,0,.05,.06,'triangle');
const beepErr = () => tone(230,0,.2,.1,'square');

async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch {
    const x = document.createElement('textarea');
    x.value = t; document.body.appendChild(x); x.select();
    try { document.execCommand('copy'); } catch {}
    x.remove();
  }
  toast('نُسخ المعرّف');
}

/* ================= علامات الحالة ================= */
const ST_SVG = {
  pending:  '<svg class="st" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6v4.6l3 1.8"/></svg>',
  sent:     '<svg class="st" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.8 5.2 10.4 14.5 2"/></svg>',
  delivered:'<svg class="st" viewBox="0 0 21 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 7 5 10.5 13 2.5"/><path d="m8.5 7 3.5 3.5L20.5 2.5"/></svg>',
  seen:     '<svg class="st" viewBox="0 0 21 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 7 5 10.5 13 2.5"/><path d="m8.5 7 3.5 3.5L20.5 2.5"/></svg>'
};
function updateMsgDom(u, st){
  const w = document.querySelector(`.msg[data-uid="${u}"] .stwrap`);
  if (w){ w.dataset.st = st; w.innerHTML = ST_SVG[st]; }
}

/* ================= عرض الرسائل ================= */
function scrollBottom(force){
  requestAnimationFrame(()=>{
    const near = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 170;
    if (force || near) msgsEl.scrollTop = msgsEl.scrollHeight;
  });
}
function appendMsgDom(m){
  const dk = dayKey(m.time);
  if (dk !== lastDay){
    msgsEl.insertAdjacentHTML('beforeend', `<div class="dsep">${esc(dayLabel(m.time))}</div>`);
    lastDay = dk;
  }
  const div = document.createElement('div');
  div.className = 'msg ' + (m.out ? 'out' : 'in');
  div.dataset.uid = m.uid;
  const meta = `<div class="bmeta"><span>${timeFmt(m.time)}</span>${m.out ? `<span class="stwrap" data-st="${m.status}">${ST_SVG[m.status]}</span>` : ''}</div>`;
  if (m.kind === 'img'){
    div.innerHTML = `<div class="bubble imgb"><img class="bimg" alt="صورة">${meta}</div>`;
    const im = div.querySelector('.bimg');
    im.src = m.data;
    im.onclick = () => openViewer(m.data);
  } else {
    div.innerHTML = `<div class="bubble"><div class="btext"></div>${meta}</div>`;
    div.querySelector('.btext').textContent = m.text;
  }
  if (typingRow && typingRow.parentNode === msgsEl) msgsEl.insertBefore(div, typingRow);
  else msgsEl.appendChild(div);
}
function renderMsgs(c){
  msgsEl.innerHTML = ''; lastDay = null;
  makeTyping();
  if (!c.messages.length)
    msgsEl.insertAdjacentHTML('beforeend','<div class="no-msgs">لا رسائل بعد — اكتب أول رسالة وستُسلَّم حتى لو كان الطرف الآخر غير متصل.</div>');
  msgsEl.appendChild(typingRow);
  try { c.messages.forEach(appendMsgDom); } catch {}
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

/* ================= القائمة والهيدر ================= */
function updateTitle(){
  const n = Object.values(chats).reduce((a,c)=>a+(c.unread||0),0);
  document.title = n ? `(${n}) مِرسال` : 'مِرسال';
}
function renderChatList(){
  const list = $('chatList'); list.innerHTML = '';
  const arr = Object.values(chats).sort((a,b)=>(b.last||b.created)-(a.last||a.created));
  if (!arr.length){ list.innerHTML = '<div class="list-empty">لا محادثات</div>'; updateTitle(); return; }
  arr.forEach(c => {
    const last = c.messages[c.messages.length-1];
    const typing = (c.pid === activePid) && typUntil > Date.now();
    const el = document.createElement('button');
    el.className = 'chat-item' + (c.pid === activePid ? ' active' : '');
    el.dataset.pid = c.pid;
    const avHtml = c.avatar ? `<span class="avatar"><img alt="" src="${esc(c.avatar)}"></span>`
                            : `<span class="avatar" style="background:${avColor(c.pid)}">${esc(initial(chatTitle(c)))}</span>`;
    el.innerHTML = `
      ${avHtml}
      <span class="ci-main">
        <span class="ci-row1"><span class="ci-name">${esc(chatTitle(c))}</span><span class="ci-time">${last ? timeFmt(last.time) : ''}</span></span>
        <span class="ci-row2">${
          typing ? '<span class="tp">يكتب…</span>'
          : last ? `${last.out ? `<span class="stwrap" data-st="${last.status}">${ST_SVG[last.status]}</span>` : ''}<span>${esc(last.kind==='img' ? 'صورة' : last.text)}</span>`
          : '<span>محادثة جديدة</span>'
        }</span>
      </span>
      ${c.unread ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}`;
    list.appendChild(el);
  });
  updateTitle();
}
function renderHeader(){
  if (!activePid) return;
  const c = chats[activePid]; if (!c) return;
  if (c.avatar) $('cAvatar').innerHTML = `<img alt="" src="${esc(c.avatar)}">`;
  else { $('cAvatar').textContent = initial(chatTitle(c)); $('cAvatar').style.background = avColor(c.pid); }
  $('cName').textContent = chatTitle(c);
  const dot = $('cDot'), st = $('cStatText');
  st.className = '';
  if (typUntil > Date.now()){ dot.className = 'dot wait'; st.textContent = 'يكتب الآن…'; st.className = 'typing'; return; }
  if (!brokerUp){ dot.className = 'dot wait'; st.textContent = 'جارٍ الاتصال…'; return; }
  const p = c.pres;
  if (p && p.on && Date.now() - (p.ts||0) < 60000){ dot.className = 'dot on'; st.textContent = 'متصل الآن'; return; }
  if (p && p.ts){ dot.className = 'dot off'; st.textContent = 'آخر ظهور ' + timeFmt(p.ts); return; }
  dot.className = 'dot off'; st.textContent = 'غير متصل — ستُسلَّم رسائلك عند تواجده';
}
function openChat(pid){
  const c = chats[pid];
  if (!c) return;
  activePid = pid; typUntil = 0;
  if (typingRow) typingRow.hidden = true;
  c.unread = 0; saveChat(pid);
  $('conv').hidden = false;
  document.body.classList.add('in-chat');
  try { renderHeader(); renderMsgs(c); } catch {}
  renderChatList();
  sendSeenAll(pid);
  setTimeout(()=> $('ta').focus(), 60);
}
function sendSeenAll(pid){
  const c = chats[pid]; if (!c || !client || !client.connected) return;
  c.messages.forEach(m => { if (!m.out && m.status !== 'seen') sendAckOne(m.uid, pid, 's'); });
}

/* ================= طبقة MQTT — تسليم دائم بلا شرط اتصال الطرفين ================= */
function setNet(s){
  const m = { online:'متصل', connecting:'جارٍ الاتصال…', offline:'غير متصل' };
  $('netDot').className = 'dot ' + (s==='online'?'on':s==='connecting'?'wait':'off');
  $('netText').textContent = m[s];
}
function publishPresence(){
  if (!client || !client.connected) return;
  try {
    client.publish(T.pres(me.id), JSON.stringify({ on:true, n:me.name, a:me.avatar||null, ts:Date.now() }), { retain:true, qos:0 });
  } catch {}
}
function startMqtt(){
  clearTimeout(mqttRetry);
  if (typeof mqtt === 'undefined'){ setNet('offline'); mqttRetry = setTimeout(startMqtt, 4000); return; }
  if (client){ try { client.end(true); } catch {} client = null; }
  setNet('connecting');
  try {
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'mirsal_' + me.id + '_' + Math.random().toString(16).slice(2,8),
      keepalive: 30, clean: true, reconnectPeriod: 2500, connectTimeout: 10000,
      will: { topic: T.pres(me.id), payload: JSON.stringify({ on:false, ts:Date.now() }), retain: true, qos: 0 }
    });
  } catch { setNet('offline'); mqttRetry = setTimeout(startMqtt, 4000); return; }
  client.on('connect', onBrokerUp);
  client.on('reconnect', () => { brokerUp = false; setNet('connecting'); });
  client.on('close', () => { brokerUp = false; if (activePid) renderHeader(); });
  client.on('error', () => {});
  client.on('message', onMqttMsg);
}
function onBrokerUp(){
  brokerUp = true; setNet('online');
  try {
    client.subscribe(T.inbox(me.id) + '/#', { qos:1 });
    client.subscribe(T.ack(me.id) + '/#',  { qos:1 });
    client.subscribe(T.typ(me.id),         { qos:0 });
    Object.keys(chats).forEach(pid => { try { client.subscribe(T.pres(pid), {qos:0}); } catch {} });
  } catch {}
  publishPresence();
  // إعادة إرسال أي رسائل لم تُسلَّم + تحديث الحضور دورياً
  deliverAllPending();
  if (activePid) renderHeader();
}
function deliverAllPending(){
  let any = false;
  Object.values(chats).forEach(c => {
    c.messages.forEach(m => { if (m.out && m.status === 'pending' && sendOutbound(c.pid, m)) any = true; });
  });
  if (any) renderChatList();
}
setInterval(() => { if (brokerUp) publishPresence(); }, 25000);

/* إرسال رسالة إلى صندوق وارد الطرف الآخر (مخزّنة retained حتى يصل) */
function sendOutbound(pid, m){
  if (!client || !client.connected) return false;
  const topic = T.inbox(pid) + '/' + m.uid;
  const payload = m.kind === 'text'
    ? { t:'m', f:me.id, u:m.uid, k:'t', x:m.text, tm:m.time }
    : { t:'m', f:me.id, u:m.uid, k:'i', x:m.data, w:m.w, h:m.h, tm:m.time };
  try { client.publish(topic, JSON.stringify(payload), { qos:1, retain:true }); }
  catch { return false; }
  m.status = 'sent'; updateMsgDom(m.uid, 'sent'); saveChat(pid); beepOut(); return true;
}
/* إشعار قراءة/تسليم — يصل للمرسل حتى لو كان غير متصل لحظتها */
function sendAckOne(u, toPid, k){
  if (!client || !client.connected) return;
  try { client.publish(T.ack(toPid) + '/' + u, JSON.stringify({ k, u }), { qos:1, retain:true }); } catch {}
}
function clearTopic(topic){ try { client.publish(topic, '', { retain:true, qos:1 }); } catch {} }

function onMqttMsg(topic, payload){
  const s = payload.toString();
  if (topic.startsWith(T.inbox(me.id) + '/')){
    if (!s) return;
    const u = topic.split('/')[3];
    let d; try { d = JSON.parse(s); } catch { clearTopic(topic); return; }
    clearTopic(topic); // حذف الرسالة من الوسيط — تم التسليم
    handleInbound(d);
  }
  else if (topic.startsWith(T.ack(me.id) + '/')){
    if (!s) return;
    let d; try { d = JSON.parse(s); } catch { clearTopic(topic); return; }
    clearTopic(topic);
    handleAck(d);
  }
  else if (topic === T.typ(me.id)){
    if (!s) return;
    let d; try { d = JSON.parse(s); } catch { return; }
    if (d.f && activePid === d.f){
      typUntil = Date.now() + 2600;
      renderHeader();
      if (typingRow) typingRow.hidden = false;
      scrollBottom();
      clearTimeout(typHideT);
      typHideT = setTimeout(()=>{ if (typingRow) typingRow.hidden = true; typUntil = 0; renderHeader(); }, 2600);
    }
  }
  else if (topic.startsWith('mirsal/pres/')){
    const pid = topic.split('/')[2];
    if (!s) return;
    let d; try { d = JSON.parse(s); } catch { return; }
    const c = chats[pid]; if (!c) return;
    c.pres = { on: !!d.on, ts: +d.ts || 0 };
    if (d.n) c.name = String(d.n).slice(0,24);
    if (d.a !== undefined) c.avatar = d.a || null;
    saveChat(pid); renderChatList();
    if (activePid === pid) renderHeader();
  }
}
function handleInbound(d){
  if (!d || d.f === me.id) return;
  const pid = String(d.f);
  if (!/^\d{9}$/.test(pid)) return;
  const c = ensureChat(pid);
  const mu = String(d.u || uid());
  if (c.messages.some(x => x.uid === mu)) return;
  const m = d.k === 'i'
    ? { uid:mu, kind:'img', text:'', data:String(d.x||''), w:+d.w||0, h:+d.h||0, time:+d.tm||Date.now(), out:false, status:'delivered' }
    : { uid:mu, kind:'text', text:String(d.x||'').slice(0,2000), time:+d.tm||Date.now(), out:false, status:'delivered' };
  c.messages.push(m);
  c.messages.sort((a,b)=>a.time-b.time);
  c.last = m.time;
  if (c.messages.length > 300) c.messages.splice(0, c.messages.length - 300);
  const active = activePid === pid && !document.hidden;
  if (!active) c.unread++;
  saveChat(pid); renderChatList();
  if (activePid === pid){
    const nm = msgsEl.querySelector('.no-msgs'); if (nm) nm.remove();
    appendMsgDom(m); scrollBottom(); renderHeader();
  }
  beepIn();
  if (!active) toast(chatTitle(c) + ': ' + (m.kind === 'img' ? 'صورة' : m.text.slice(0,60)));
  sendAckOne(mu, pid, active ? 's' : 'd');
}
function handleAck(d){
  if (!d || !d.u) return;
  const k = d.k === 's' ? 'seen' : 'delivered';
  let changed = false;
  for (const c of Object.values(chats)){
    const m = c.messages.find(x => x.uid === d.u && x.out);
    if (m && m.status !== 'seen'){
      m.status = k; updateMsgDom(d.u, k); saveChat(c.pid); changed = true; break;
    }
  }
  if (changed) renderChatList();
}

/* ================= الإرسال ================= */
function sendText(){
  const text = $('ta').value.trim();
  if (!text || !activePid) return;
  const c = chats[activePid];
  const m = { uid:uid(), kind:'text', text:text.slice(0,2000), time:Date.now(), out:true, status:'pending' };
  c.messages.push(m); c.last = m.time;
  if (c.messages.length > 300) c.messages.splice(0, c.messages.length - 300);
  saveChat(activePid);
  $('ta').value = ''; taResize();
  const nm = msgsEl.querySelector('.no-msgs'); if (nm) nm.remove();
  appendMsgDom(m); scrollBottom(); renderChatList();
  if (!sendOutbound(activePid, m) && client) { /* تبقى «معلّقة» وتُرسل تلقائياً عند عودة الاتصال */ }
}

/* ================= الصور ================= */
function dataURLToBytes(u){
  const b = atob(u.split(',')[1]);
  const a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function drawScaled(img, max, q){
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (w > max || h > max){ const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  return { data: cv.toDataURL('image/jpeg', q), w, h };
}
function compressImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        let r = drawScaled(img, 1280, .75);
        if (r.data.length > 850000) r = drawScaled(img, 1000, .6);  // حد الوسيط ~1MB
        if (r.data.length > 850000) r = drawScaled(img, 800, .5);
        res(r);
      } catch { rej(); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function compressAvatar(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        if (!side) throw 0;
        const S = 256;
        const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
        cv.getContext('2d').drawImage(img, (img.naturalWidth-side)/2, (img.naturalHeight-side)/2, side, side, 0, 0, S, S);
        res(cv.toDataURL('image/jpeg', 0.82));
      } catch { rej(); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
 $('fileBtn').addEventListener('click', () => $('fileInput').click());
 $('fileInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!activePid){ toast('افتح محادثة أولاً', 'err'); return; }
  if (!f.type.startsWith('image/')){ toast('يمكن إرسال الصور فقط', 'err'); return; }
  let c; try { c = await compressImage(f); } catch { toast('تعذّر قراءة الصورة', 'err'); return; }
  const chat = chats[activePid];
  const m = { uid:uid(), kind:'img', text:'', data:c.data, w:c.w, h:c.h, time:Date.now(), out:true, status:'pending' };
  chat.messages.push(m); chat.last = m.time;
  if (chat.messages.length > 300) chat.messages.splice(0, chat.messages.length - 300);
  saveChat(activePid);
  const nm = msgsEl.querySelector('.no-msgs'); if (nm) nm.remove();
  appendMsgDom(m); scrollBottom(); renderChatList();
  sendOutbound(activePid, m);
});
function openViewer(src){ $('viewerImg').src = src; $('viewer').hidden = false; }
 $('viewer').addEventListener('click', () => { $('viewer').hidden = true; $('viewerImg').src = ''; });

/* ================= الملف الشخصي ================= */
function renderProfile(){
  paintAvatar($('pfAvatar'), me.name, me.avatar, me.id);
  $('pfName').textContent = me.name;
  $('pfId').textContent = me.id;
}
function broadcastProfile(){
  publishPresence();
  renderChatList();
  if (activePid) renderHeader();
}
function applyName(v){
  v = String(v||'').trim();
  if (v.length < 2 || v === me.name) return false;
  me.name = v.slice(0,24);
  db.set('me', me);
  broadcastProfile(); renderProfile();
  return true;
}
function applyAvatar(av){
  me.avatar = av || null;
  db.set('me', me);
  broadcastProfile(); renderProfile();
}

/* ================= الدخول ================= */
function enterApp(){
  $('welcome').hidden = true; $('app').hidden = false;
  renderProfile(); renderChatList(); setNet('connecting');
  startMqtt();
}
 $('wForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('wName').value.trim();
  if (v.length < 2){
    $('wErr').hidden = false;
    $('wName').classList.add('shake');
    setTimeout(()=> $('wName').classList.remove('shake'), 400);
    return;
  }
  $('wErr').hidden = true;
  me = { name: v.slice(0,24), id: genId(), avatar: null };
  enterApp();
  db.set('me', me);
});
(async function init(){
  try {
    const saved = await db.get('me');
    if (saved && saved.name){
      const numeric = /^\d{9}$/.test(String(saved.id||''));
      me = {
        name: String(saved.name),
        id: numeric ? String(saved.id) : genId(),
        avatar: typeof saved.avatar === 'string' ? saved.avatar : null
      };
      const all = await db.all();
      for (const k in all) if (k.startsWith('chat:')) chats[k.slice(5)] = all[k];
      Object.values(chats).forEach(c => {
        c.messages.forEach(m => { if (m.out && m.status !== 'seen') m.status = 'pending'; });
        if (!c.pres) c.pres = null;
      });
      if (!numeric) db.set('me', me);
      enterApp();
    }
  } catch {}
})();

/* ================= أحداث الواجهة ================= */
const ta = $('ta');
function taResize(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
ta.addEventListener('input', () => {
  taResize();
  if (client && client.connected && activePid && Date.now() - lastTypeSent > 1500){
    try { client.publish(T.typ(activePid), JSON.stringify({ f: me.id }), { qos:0 }); lastTypeSent = Date.now(); } catch {}
  }
});
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } });
 $('sendBtn').addEventListener('click', sendText);

/* قائمة المحادثات: نقرة = فتح، ضغط مطوّل أو زر أيمن = حذف */
let lpTimer = null, suppressClick = false;
 $('chatList').addEventListener('click', e => {
  if (suppressClick){ suppressClick = false; return; }
  const item = e.target.closest('.chat-item');
  if (item && item.dataset.pid) openChat(item.dataset.pid);
});
 $('chatList').addEventListener('pointerdown', e => {
  const item = e.target.closest('.chat-item');
  if (!item || !item.dataset.pid) return;
  const pid = item.dataset.pid;
  lpTimer = setTimeout(() => { lpTimer = null; suppressClick = true; openDeleteModal(pid); }, 550);
});
['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev =>
  $('chatList').addEventListener(ev, () => { if (lpTimer){ clearTimeout(lpTimer); lpTimer = null; } })
);
 $('chatList').addEventListener('contextmenu', e => {
  const item = e.target.closest('.chat-item');
  if (!item || !item.dataset.pid) return;
  e.preventDefault();
  suppressClick = true; setTimeout(()=> suppressClick = false, 100);
  openDeleteModal(item.dataset.pid);
});

 $('newChatBtn').addEventListener('click', openConnectModal);
 $('mcClose').addEventListener('click', closeConnectModal);
 $('mConnect').addEventListener('click', e => { if (e.target === $('mConnect')) closeConnectModal(); });
 $('mcInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,9); });
 $('mcInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('mcGo').click(); });
 $('mcGo').addEventListener('click', () => {
  const pid = normId($('mcInput').value);
  if (!pid){ $('mcErr').textContent = 'أدخل معرّفاً صحيحاً من 9 أرقام.'; $('mcErr').hidden = false; return; }
  if (pid === me.id){ $('mcErr').textContent = 'هذا معرّفك أنت — شاركه مع الطرف الآخر ليكتب إليك.'; $('mcErr').hidden = false; return; }
  $('mcErr').hidden = true;
  // تُنشأ المحادثة فوراً حتى لو كان الطرف الآخر غير متصل — رسائلك تنتظره على الوسيط
  const c = ensureChat(pid);
  closeConnectModal();
  openChat(pid);
  toast('أُنشئت المحادثة — ستصل رسائلك إليه فور تواجده');
});
function openConnectModal(){
  $('mConnect').hidden = false;
  $('mcInput').value = ''; $('mcErr').hidden = true;
  setTimeout(()=> $('mcInput').focus(), 60);
}
function closeConnectModal(){ $('mConnect').hidden = true; }

/* حذف المحادثة */
let deleteTarget = null;
function openDeleteModal(pid){
  const c = chats[pid]; if (!c) return;
  deleteTarget = pid;
  $('mdName').textContent = chatTitle(c);
  $('mDelete').hidden = false;
}
function closeDeleteModal(){ $('mDelete').hidden = true; deleteTarget = null; }
 $('mdClose').addEventListener('click', closeDeleteModal);
 $('mdNo').addEventListener('click', closeDeleteModal);
 $('mDelete').addEventListener('click', e => { if (e.target === $('mDelete')) closeDeleteModal(); });
 $('mdYes').addEventListener('click', () => {
  const pid = deleteTarget;
  if (!pid) return;
  const c = chats[pid];
  if (c){
    // مسح الرسائل المستلمة من الوسيط كي لا تُعاد
    c.messages.forEach(m => { if (!m.out) clearTopic(T.inbox(me.id) + '/' + m.uid); });
    try { client && client.connected && client.unsubscribe(T.pres(pid)); } catch {}
  }
  if (activePid === pid){
    activePid = null; typUntil = 0;
    if (typingRow) typingRow.hidden = true;
    $('conv').hidden = true;
    document.body.classList.remove('in-chat');
  }
  db.del('chat:'+pid);
  delete chats[pid];
  renderChatList();
  closeDeleteModal();
  toast('حُذفت المحادثة');
});

 $('backBtn').addEventListener('click', () => {
  activePid = null; typUntil = 0;
  if (typingRow) typingRow.hidden = true;
  $('conv').hidden = true;
  document.body.classList.remove('in-chat');
  renderChatList();
});
 $('clearBtn').addEventListener('click', () => {
  if (!activePid) return;
  if (!confirm('مسح سجل هذه المحادثة من جهازك؟')) return;
  chats[activePid].messages = []; chats[activePid].unread = 0; chats[activePid].last = 0;
  saveChat(activePid); renderMsgs(chats[activePid]); renderChatList();
});
 $('logoutBtn').addEventListener('click', async () => {
  if (!confirm('تسجيل الخروج ومسح جميع البيانات من هذا المتصفح؟')) return;
  try { client && client.end(true); } catch {}
  try {
    const all = await db.all();
    for (const k in all) await db.del(k);
  } catch {}
  location.reload();
});
 $('copyIdBtn').addEventListener('click', () => copyText(me.id));

 $('editNameBtn').addEventListener('click', () => {
  const inp = $('pfNameInput');
  $('pfName').hidden = true; inp.hidden = false;
  inp.value = me.name; inp.focus(); inp.select();
});
 $('pfNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape'){ e.target.value = me.name; e.target.blur(); } });
 $('pfNameInput').addEventListener('blur', () => {
  const inp = $('pfNameInput');
  if (inp.hidden) return;
  applyName(inp.value);
  inp.hidden = true; $('pfName').hidden = false;
});

/* ================= الإعدادات ================= */
 $('settingsBtn').addEventListener('click', () => {
  $('viewList').hidden = false; $('viewAccount').hidden = true;
  paintAvatar($('rowAvatar'), me.name, me.avatar, me.id);
  $('rowSub').textContent = me.name + ' · ' + me.id;
  $('mSettings').hidden = false;
});
 $('setClose').addEventListener('click', () => $('mSettings').hidden = true);
 $('mSettings').addEventListener('click', e => { if (e.target === $('mSettings')) $('mSettings').hidden = true; });
 $('rowAccount').addEventListener('click', () => {
  $('viewList').hidden = true; $('viewAccount').hidden = false;
  paintAvatar($('accAvatar'), me.name, me.avatar, me.id);
  $('accName').value = me.name;
  $('accId').textContent = me.id;
});
 $('accBack').addEventListener('click', () => {
  $('viewAccount').hidden = true; $('viewList').hidden = false;
  paintAvatar($('rowAvatar'), me.name, me.avatar, me.id);
  $('rowSub').textContent = me.name + ' · ' + me.id;
});
 $('accAvWrap').addEventListener('click', () => $('avatarInput').click());
 $('avatarInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!f.type.startsWith('image/')){ toast('اختر ملف صورة', 'err'); return; }
  let av; try { av = await compressAvatar(f); } catch { toast('تعذّر قراءة الصورة', 'err'); return; }
  applyAvatar(av);
  paintAvatar($('accAvatar'), me.name, me.avatar, me.id);
  toast('تم تحديث الصورة الشخصية');
});
 $('accName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
 $('accName').addEventListener('blur', () => {
  if (applyName($('accName').value)) toast('تم تحديث الاسم');
  $('accName').value = me.name;
});
 $('accCopy').addEventListener('click', () => copyText(me.id));

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && activePid && chats[activePid]){
    const c = chats[activePid];
    if (c.unread){ c.unread = 0; saveChat(activePid); renderChatList(); }
    sendSeenAll(activePid);
  }
});
window.addEventListener('beforeunload', () => {
  try { client && client.publish(T.pres(me.id), JSON.stringify({ on:false, ts:Date.now() }), { retain:true, qos:0 }); } catch {}
});
</script>
